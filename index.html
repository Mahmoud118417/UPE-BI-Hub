<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UPE BI Hub — Juhayna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#eaf6fd;
    --bg-bottom:#bcdff2;
    --blue:#0f63b3;
    --blue-dark:#0a3d68;
    --navy:#16324a;
    --white:#ffffff;
    --grey-border:#dce7ef;
    --amber:#c98a12;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    color:var(--navy);
    min-height:100vh;
    background:linear-gradient(160deg,var(--bg-top) 0%,var(--bg-bottom) 55%,#9fd1ec 100%);
    padding:40px 24px 60px;
  }
  .wrap{max-width:1040px;margin:0 auto;}

  header{
    display:flex;
    justify-content:center;
    margin-bottom:36px;
  }
  .logo-slot img{height:150px;width:auto;display:block;}

  .hero{margin-bottom:34px;text-align:center;}
  .hero h2{
    font-family:'Times New Roman', Times, serif;
    font-size:clamp(26px,4vw,36px);
    font-weight:700;
    color:var(--blue-dark);
    margin:0 0 8px;
    letter-spacing:-0.02em;
  }
  .hero p{
    font-family:'Times New Roman', Times, serif;
    margin:0 auto;
    font-size:16px;
    color:#3c6588;
    max-width:560px;
    line-height:1.5;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:18px;
  }

  .card{
    background:var(--white);
    border-radius:var(--radius);
    padding:22px 20px 20px;
    border:1px solid var(--grey-border);
    box-shadow:0 10px 24px rgba(16,64,105,.08);
    display:flex;
    flex-direction:column;
    min-height:168px;
    position:relative;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card, .card *{text-decoration:none;}
  .card.live{cursor:pointer;}
  .card.live:hover{
    transform:translateY(-3px);
    box-shadow:0 16px 30px rgba(16,64,105,.14);
  }
  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .tag{
    font-size:11px;
    font-weight:600;
    color:var(--blue);
    background:#e7f2fb;
    padding:4px 9px;
    border-radius:20px;
    white-space:nowrap;
  }
  .tag.pending{color:var(--amber);background:#fbf1e0;}

  .card h3{
    font-family:'Comic Sans MS', 'Comic Sans', cursive, sans-serif;
    font-size:19px;
    font-weight:700;
    margin:14px 0 4px;
    color:var(--blue-dark);
    letter-spacing:-0.01em;
  }
  .card .ar{
    font-size:13px;
    color:#6a8aa3;
    margin:0 0 10px;
    direction:rtl;
    text-align:left;
  }
  .card-footer{
    margin-top:auto;
    padding-top:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .open-btn{
    font-size:13px;
    font-weight:600;
    color:var(--white);
    background:var(--blue);
    padding:8px 14px;
    border-radius:8px;
    text-decoration:none;
    display:inline-block;
  }
  .open-btn:hover{background:var(--blue-dark);}
  .no-link{
    font-size:12.5px;
    color:#a98a4b;
    font-weight:500;
  }

  a.card-link{text-decoration:none;color:inherit;display:block;}

  footer{
    margin-top:44px;
    text-align:center;
    font-size:12px;
    color:#5c85a3;
  }
</style>
</head>

  function renderTools(){
    const gridEl = document.getElementById("toolGrid");
    gridEl.innerHTML = "";
    tools.forEach(t => {
      const hasLink = !!t.url;
      const card = document.createElement(hasLink ? "a" : "div");
      card.className = "card" + (hasLink ? " live" : "");
      if (hasLink){
        card.href = t.url;
        card.target = "_blank";
        card.rel = "noopener noreferrer";
      }

      card.innerHTML = `
        <div class="card-top">
          <span class="tag ${hasLink ? "" : "pending"}">${t.tag ? t.tag : (hasLink ? "Live" : "Coming soon")}</span>
        </div>
        <h3>${t.name}</h3>
        ${t.nameAr ? `<p class="ar">${t.nameAr}</p>` : ""}
        <div class="card-footer">
          ${hasLink ? `<span class="open-btn">Open →</span>` : `<span class="no-link">Link not set yet</span>`}
        </div>
      `;
      gridEl.appendChild(card);
    });
  }
